openapi: 3.0.3
info:
  title: CAB System - User & Authentication API
  version: 1.0.0
  description: |
    API specification for customer and staff authentication, profile management, and account lifecycle.
    Derived functional requirements: FR-05, FR-06, FR-09, FR-10.

servers:
  - url: https://api.cab-system.local/v1
    description: CAB API Server

x-functional-requirements:
  - FR-05
  - FR-06
  - FR-09
  - FR-10

paths:
  /customers/register:
    post:
      summary: Đăng ký khách hàng
      operationId: registerCustomer
      tags: [Customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
      responses:
        '201':
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '400':
          $ref: '#/components/responses/BadRequest'

  /customers/login:
    post:
      summary: Đăng nhập khách hàng
      operationId: loginCustomer
      tags: [Customer]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /customers/{customerId}:
    get:
      summary: Lấy thông tin khách hàng
      operationId: getCustomerById
      tags: [Customer]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Thông tin khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
    put:
      summary: Cập nhật thông tin khách hàng
      operationId: updateCustomerProfile
      tags: [Customer]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'

  /drivers/register:
    post:
      summary: Đăng ký tài xế
      operationId: registerDriver
      tags: [Driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDriverRequest'
      responses:
        '201':
          description: Tài xế được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'

  /drivers/login:
    post:
      summary: Đăng nhập tài xế
      operationId: loginDriver
      tags: [Driver]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /drivers/{driverId}:
    get:
      summary: Lấy hồ sơ tài xế
      operationId: getDriverById
      tags: [Driver]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      responses:
        '200':
          description: Hồ sơ tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'
    put:
      summary: Cập nhật hồ sơ tài xế
      operationId: updateDriverProfile
      tags: [Driver]
      parameters:
        - $ref: '#/components/parameters/DriverId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDriverRequest'
      responses:
        '200':
          description: Cập nhật hồ sơ thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DriverProfile'

  /operators/login:
    post:
      summary: Đăng nhập nhân viên vận hành
      operationId: loginOperator
      tags: [Operator]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

components:
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DriverId:
      name: driverId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Không được phép truy cập
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [token, expiresAt, userId, role]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
        role:
          type: string
          enum: [customer, driver, operator, admin]

    RegisterCustomerRequest:
      type: object
      required: [fullName, phone, email, password]
      properties:
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        city:
          type: string

    CustomerProfile:
      type: object
      required: [id, fullName, phone, email, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]
        createdAt:
          type: string
          format: date-time

    UpdateCustomerRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        city:
          type: string

    RegisterDriverRequest:
      type: object
      required: [fullName, phone, email, password, vehicleType]
      properties:
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        vehicleType:
          type: string
          enum: [car, motorbike, van]

    DriverProfile:
      type: object
      required: [id, fullName, phone, email, status, availability]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [approved, pending, suspended]
        availability:
          type: string
          enum: [available, unavailable, busy]
        vehicleId:
          type: string
          format: uuid

    UpdateDriverRequest:
      type: object
      properties:
        fullName:
          type: string
        phone:
          type: string
        availability:
          type: string
          enum: [available, unavailable, busy]

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
