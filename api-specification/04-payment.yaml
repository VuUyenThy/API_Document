openapi: 3.0.3
info:
  title: CAB System - Payment API
  version: 1.0.0
  description: |
    API specification for fare calculation, payment processing, and payment inquiry.
    Derived functional requirements: FR-01, FR-04, FR-07, FR-08, FR-09.

servers:
  - url: https://api.cab-system.local/v1
    description: CAB API Server

x-functional-requirements:
  - FR-01
  - FR-04
  - FR-07
  - FR-08
  - FR-09

paths:
  /trips/{tripId}/fare:
    post:
      summary: Tính cước chuyến đi
      operationId: calculateTripFare
      tags: [Payment]
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Cước đã được tính
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FareQuotation'

  /payments:
    post:
      summary: Tạo giao dịch thanh toán
      operationId: createPayment
      tags: [Payment]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Giao dịch thanh toán được tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /payments/{paymentId}/confirm:
    post:
      summary: Xác nhận thanh toán
      operationId: confirmPayment
      tags: [Payment]
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentConfirmationRequest'
      responses:
        '200':
          description: Thanh toán xác nhận thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /customers/{customerId}/payments:
    get:
      summary: Tra cứu lịch sử thanh toán khách hàng
      operationId: listCustomerPayments
      tags: [Payment]
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Danh sách giao dịch
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'

components:
  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    FareQuotation:
      type: object
      required: [tripId, amount, currency, serviceType]
      properties:
        tripId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        currency:
          type: string
          default: VND
        serviceType:
          type: string
          enum: [normal, premium, corporate]
        details:
          type: string

    CreatePaymentRequest:
      type: object
      required: [tripId, customerId, amount, method]
      properties:
        tripId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        method:
          type: string
          enum: [cash, bank_transfer, e_wallet]
        provider:
          type: string

    Payment:
      type: object
      required: [id, tripId, customerId, amount, method, status]
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        method:
          type: string
          enum: [cash, bank_transfer, e_wallet]
        status:
          type: string
          enum: [pending, paid, failed, refunded]
        paidAt:
          type: string
          format: date-time
          nullable: true

    PaymentConfirmationRequest:
      type: object
      required: [transactionRef, status]
      properties:
        transactionRef:
          type: string
        status:
          type: string
          enum: [paid, failed]
        message:
          type: string
